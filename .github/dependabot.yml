# Dependabot configuration.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Scope is deliberately narrow — just two ecosystems:
#   1. github-actions  → pinned action versions in .github/workflows/*.yml
#   2. terraform       → provider constraints in terraform/versions.tf
#
# Docker images are intentionally NOT watched — the compose file uses
# floating tags (caddy:2-alpine, pingvin:latest) and pulls fresh on every
# `docker compose pull` during routine maintenance. See docs/04-maintenance.md.

version: 2

updates:
  # --- GitHub Actions ----------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Bundle minor + patch bumps into a single PR; majors stay separate so
      # they're reviewed individually (they may have breaking changes).
      actions-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # --- Terraform providers ----------------------------------------------
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "terraform"
      include: "scope"
    labels:
      - "dependencies"
      - "terraform"
    ignore:
      # Cloudflare v5 renamed cloudflare_record → cloudflare_dns_record
      # and changed several attribute schemas. Pin to v4 until we do a
      # dedicated migration PR. Remove this block after migrating.
      - dependency-name: "cloudflare/cloudflare"
        versions: [">= 5.0.0"]
    groups:
      tf-providers-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

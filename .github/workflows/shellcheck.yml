name: ShellCheck

# Lints all shell scripts in scripts/ on every change.
# Catches the classic shell footguns: unquoted variables, missing `set -e`,
# typos in variable names, etc.
#
# Runs on ALL PRs (no path filter) so that branch protection rules that
# require this check to pass can never be bypassed by a docs-only PR.
# Cost: ~10 s of Actions time per PR that doesn't touch scripts/.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck scripts/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: warning

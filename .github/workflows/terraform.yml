name: Terraform

# Runs format-check and validate on every PR and on pushes to main.
# Free on public repos.
#
# Runs on ALL PRs (no path filter) so that branch protection rules that
# require this check to pass can never be bypassed by a docs-only PR.
# Cost: ~20 s of Actions time per PR that doesn't touch Terraform —
# negligible on a hobby repo, and unlimited on public repos anyway.
#
# It does NOT run `terraform plan` — that would require Hetzner and Cloudflare
# tokens stored as secrets, and for a hobby project this is overkill.
# Validation alone catches ~95% of mistakes (syntax, missing variables,
# wrong types, undeclared resources).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        id: validate
        run: terraform validate -no-color
